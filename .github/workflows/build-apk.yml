name: Build PERUNA APK

# Käynnistyy, kun koodi tai zip työnnetään GitHubiin, tai käsin Actions-välilehdeltä ("Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # tarvitaan, jotta valmis APK voidaan liittää Releases-sivulle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Puhelinreitti: jos repossa on vain peruna-android-project.zip, pura se.
      - name: Unpack project zip if needed
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f peruna-android-project.zip ]; then
            echo "Unpacking peruna-android-project.zip ..."
            unzip -q -o peruna-android-project.zip
          fi

      - name: Locate Android project
        id: locate
        run: |
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found. Upload the project files or peruna-android-project.zip to the repository root."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK (exists, no risky permissions)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          ls -l "$APK"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          echo "### PERUNA APK check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$AAPT2" dump permissions "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if "$AAPT2" dump permissions "$APK" | grep -E "INTERNET|NETWORK|CAMERA|LOCATION|RECORD_AUDIO|CONTACTS|STORAGE|PHONE"; then
            echo "::error::Unexpected permission found in APK"
            exit 1
          fi
          echo "No network/camera/location/contacts/storage permissions found."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: peruna-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Helppo puhelinlataus: APK liitetään Releases-sivulle, jolloin sen voi ladata suoraan ilman zip-purkua.
      - name: Publish APK to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PERUNA-debug.apk
          gh release create "build-${{ github.run_number }}" PERUNA-debug.apk \
            --repo "${{ github.repository }}" \
            --title "PERUNA debug build ${{ github.run_number }}" \
            --notes "Debug-APK. Asenna puhelimeen: lataa PERUNA-debug.apk ja avaa se." \
            --prerelease

      # Yksikkötestit ajetaan APK:n jälkeen: epäonnistunut testi ei estä APK:n latausta,
      # mutta näkyy yhteenvedossa.
      - name: Run unit tests
        id: tests
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Test summary
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "Unit tests: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unit tests: FAILED or skipped (see the 'Run unit tests' step log)" >> "$GITHUB_STEP_SUMMARY"
          fi

